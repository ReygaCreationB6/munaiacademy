    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "MUN AI Academy",
    "url": "https://your-domain.com/",
    "description": "AI-powered Model United Nations training platform. Learn diplomacy, practice speeches and debates, and run full conference simulations.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "audience": {
      "@type": "EducationalAudience",
      "educationalRole": "student"
    }
  }
  </script>

    <!-- Structured data: FAQ (helps search snippets) -->
    <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is MUN AI Academy?",
        "acceptedAnswer": { "@type": "Answer", "text": "A free AI-powered training platform for Model United Nations delegates. It includes lessons, a speech trainer, a debate trainer, a POI trainer, a position paper builder, a resolution builder, and a full stateful conference simulation." }
      },
      {
        "@type": "Question",
        "name": "Is MUN AI Academy free?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. The built-in AI has a free tier per visitor. You can also bring your own API key for unlimited use." }
      },
      {
        "@type": "Question",
        "name": "Do I need an account?",
        "acceptedAnswer": { "@type": "Answer", "text": "No. You can use the platform locally without signing in. Signing in enables cloud sync across devices." }
      }
    ]
  }
  </script>
</head>

<body>
    <div id="app"></div>
    <div id="routeAriaLive" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <script type="module" src="./src/main.js"></script>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            if (isLocalhost) {
                navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
                if (window.caches) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
            } else {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => { });
                });
            }
        }
    </script>
</body>
